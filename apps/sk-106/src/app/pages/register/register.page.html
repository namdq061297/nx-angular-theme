<main class="page">
  <app-image name="login_bg" alt="Login Background" class="login-bg"></app-image>
  <app-icon name="ic_logo_full" [height]="50" [width]="130" alt="VCB" />
  <section class="login-card">
    <header class="login-header">
      <button type="button" class="back-button" aria-label="Quay lai" (click)="goBack()">
        <app-icon name="ic_back" [size]="24" alt=""></app-icon>
      </button>

      <h1 class="title_medium">Đăng ký</h1>
      <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <section>
      <p class="body_small_regular text-center text-error">
        Quý khách chưa có thông tin trên hệ thống.<br />Vui lòng <b>ĐĂNG KÝ</b> để sử dụng dịch vụ
      </p>
    </section>

    <form class="login-form" (submit)="$event.preventDefault(); onRegister()">
      <app-text-input label="Họ và tên" placeholder="Nhập họ và tên" autocomplete="name" [required]="true"
        [requiredErrorMessage]="validationMessages.fullNameRequired" [submitted]="submitAttempted()"
        [value]="fullName()" (valueChange)="onFullNameChange($event)"></app-text-input>

      <app-text-input label="Số giấy tờ tùy thân" placeholder="Nhập số giấy tờ tùy thân" autocomplete="off"
        [required]="true" [requiredErrorMessage]="validationMessages.documentIdRequired" [submitted]="submitAttempted()"
        [value]="documentId()" (valueChange)="onDocumentIdChange($event)"></app-text-input>

      <app-text-input label="Số điện thoại" placeholder="Nhập số điện thoại" autocomplete="tel" inputmode="numeric"
        [pattern]="phonePattern" [required]="true" [requiredErrorMessage]="validationMessages.phoneRequired"
        [patternErrorMessage]="validationMessages.phonePattern" [submitted]="submitAttempted()" [value]="phoneNumber()"
        (valueChange)="onPhoneNumberChange($event)"></app-text-input>

      <div class="captcha-inline">
        <app-text-input class="captcha-input" label="Mã xác thực" placeholder="Nhập mã CAPTCHA" autocomplete="off"
          [required]="true" [requiredErrorMessage]="validationMessages.captchaRequired" [submitted]="submitAttempted()"
          [value]="captchaCode()" (valueChange)="onCaptchaCodeChange($event)"></app-text-input>

        <div class="captcha-panel">
          <img class="captcha-image" [src]="captchaImageData()" alt="Captcha" />
          <button type="button" class="captcha-refresh" [disabled]="captchaLoading()" (click)="refreshCaptcha()"
            aria-label="Làm mới CAPTCHA">
            <app-icon name="ic_refresh" [size]="20" alt=""></app-icon>
          </button>
        </div>
      </div>

      @if (captchaLoadError()) {
      <p class="captcha-message body_small_regular">{{ validationMessages.captchaLoadFailed }}</p>
      }

      @if (captchaInvalidMessage()) {
      <p class="captcha-message body_small_regular">{{ captchaInvalidMessage() }}</p>
      }

      <app-button label="Đăng ký" [disabled]="!canRegister()" (pressed)="onRegister()"></app-button>
    </form>
  </section>
</main>
<app-footer />
