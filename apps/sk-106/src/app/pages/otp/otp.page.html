<main class="page">
  <app-image
    name="login_bg"
    alt="Login Background"
    class="login-bg"
  ></app-image>

  <section class="login-card">
    <header class="login-header">
      <button type="button" class="back-button" aria-label="Quay lai" (click)="goBack()">
        <app-icon name="ic_back" [size]="24" alt=""></app-icon>
      </button>

      <h1 class="title_medium">Nhập mã OTP</h1>
      <span class="header-spacer" aria-hidden="true"></span>
    </header>

    <section class="login-note" aria-label="Thông báo đăng nhập">
      <p class="body_small_regular">
      Vui lòng nhập mã OTP vừa được gửi đến số điện thoại 0345867123
      </p>
    </section>

    <div class="grid w-full grid-cols-2 gap-4">
      <app-button label="Huỷ" type="secondary"></app-button>
      <app-button label="Xác nhận"></app-button>
    </div>


    <p class="register-copy body_small_medium">
     Chưa nhận được mã OTP? Gửi lại sau 
      <a class="body_small_semibold">(01:59)</a>
    </p>
  </section>
</main>
<app-footer />
