<main class="page">
	<section class="request-search">
		<h1 class="title_small">Tra cứu yêu cầu đã gửi</h1>

		<div class="request-search__input">
			<app-text-input
				[isSearch]="true"
				[label]="''"
				[value]="searchValue()"
				[placeholder]="'Nhập GTTT hoặc Số điện thoại để tra cứu yêu cầu'"
				(valueChange)="onSearchChange($event)"
			/>
		</div>
	</section>

	<section class="request-tabs" aria-label="Danh mục sản phẩm">
		@for (tab of tabs; track tab.key) {
			<button
				type="button"
				class="request-tabs__item"
				[class.request-tabs__item--active]="tab.key === activeTab()"
				(click)="setActiveTab(tab.key)"
			>
				{{ tab.label }}
			</button>
		}
	</section>

	<!-- <section class="request-content" aria-live="polite">
		<header class="request-content__header">
			<h2>{{ activeTabContent().label }}</h2>
			<p>{{ activeTabContent().description }}</p>
		</header>

		<ng-container
			[ngComponentOutlet]="activeTabComponent()"
			[ngComponentOutletInputs]="activeTabInputs()"
		/>
	</section> -->
</main>
  <app-footer />
