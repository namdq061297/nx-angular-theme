<div class="modal-backdrop" (click)="onBackdropClick($event)">
  <div
    class="modal-container"
    [style.width]="config.width || '520px'"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="'modal-title-' + instanceId"
    (click)="$event.stopPropagation()"
  >
    <!-- Header -->
    <div class="modal-header">
      <h2 class="modal-title" [id]="'modal-title-' + instanceId">{{ config.title }}</h2>
      <button
        *ngIf="config.showCloseButton !== false"
        class="modal-close-btn"
        (click)="onClose()"
        aria-label="Đóng modal"
        title="Đóng"
      >
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M1 1L17 17M17 1L1 17" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </div>

    <!-- Dynamic content -->
    <div class="modal-body">
      <ng-container #contentHost></ng-container>
    </div>
  </div>
</div>
